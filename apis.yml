name: SVAcademy
description: SV Academy is a tech-sales training and talent-placement organization that
  runs an intensive Sales Development Representative (SDR) program and places pre-trained,
  job-ready graduates with employers at no placement fee. It has trained more than 6,000
  graduates across the U.S. and Canada and is a portfolio company of 500 Global. SV Academy
  serves two audiences — job seekers who complete the SDR training program with no prior
  experience or degree required, and employers who hire and onboard vetted, pre-trained SDR
  talent. The organization publishes no public developer API surface at this time; this
  profile was surfaced as a 500 Global portfolio company and enriched by the API Evangelist
  pipeline from SV Academy's public web presence.
